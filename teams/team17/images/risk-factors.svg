<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Selected withdrawal rates"><rect width="720" height="320" fill="#fbfaf6" rx="10"/><text x="28" y="35" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#243c3b">Withdrawal rate in selected groups</text><g font-family="Arial,sans-serif" font-size="12" fill="#465653"><text x="28" y="87">Light course load</text><text x="28" y="149">Heavy course load</text><text x="28" y="211">No website activity</text></g><g fill="#e4e7df"><rect x="175" y="67" width="430" height="28" rx="5"/><rect x="175" y="129" width="430" height="28" rx="5"/><rect x="175" y="191" width="430" height="28" rx="5"/></g><g><rect x="175" y="67" width="109" height="28" rx="5" fill="#177d70"/><rect x="175" y="129" width="266" height="28" rx="5" fill="#d96c4b"/><rect x="175" y="191" width="382" height="28" rx="5" fill="#d96c4b"/></g><g font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#243c3b"><text x="618" y="87">25.4%</text><text x="454" y="149">61.9%</text><text x="570" y="211">88.8%</text></g><text x="175" y="253" font-family="Arial,sans-serif" font-size="12" fill="#75817b">Course load: ≤60 credits vs &gt;180 credits · No activity group: 3,365 students</text><text x="175" y="274" font-family="Arial,sans-serif" font-size="11" fill="#75817b">Rates are observed associations, not causal effects.</text></svg>
