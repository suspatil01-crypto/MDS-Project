<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="PCA variation summary"><rect width="720" height="280" fill="#fbfaf6" rx="10"/><text x="28" y="35" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#243c3b">Principal Component Analysis (PCA)</text><text x="28" y="66" font-family="Arial,sans-serif" font-size="13" fill="#65736c">Variation captured by first three components</text><rect x="28" y="92" width="650" height="35" rx="8" fill="#e4e7df"/><rect x="28" y="92" width="520" height="35" rx="8" fill="#177d70"/><text x="42" y="115" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff">80% captured</text><g font-family="Arial,sans-serif" fill="#465653" font-size="13"><text x="28" y="162">Only 3 components</text><text x="28" y="184">capture 80% of variation in engineered features.</text><text x="28" y="220">Implication: many engagement measures overlap.</text><text x="28" y="242">Original features performed better than PCA features in the reported model comparison.</text></g></svg>
